      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
        base, { name:'AES-GCM', length: 256 }, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, ct);
      var html = new TextDecoder().decode(plain);
      localStorage.removeItem(FAIL_KEY); localStorage.removeItem(LOCK_KEY);
      document.open(); document.write(html); document.close();
    } catch (e) { fail(); }
  }
</script>
