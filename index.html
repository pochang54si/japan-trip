    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function fail(){
    busy = false;
    var fails = getFails() + 1;
    if (fails >= MAX_TRIES) {
      localStorage.setItem(LOCK_KEY, String(Date.now() + LOCK_MS));
      localStorage.removeItem(FAIL_KEY);
      reportLockout();
      setLockedUI();
      return;
    }
    localStorage.setItem(FAIL_KEY, String(fails));
    var left = MAX_TRIES - fails;
    msg.className = 'err';
    msg.textContent = 'Incorrect passcode — ' + left + (left === 1 ? ' try' : ' tries') + ' left before lockout.';
    var card = document.getElementById('card');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    boxes.forEach(function(b){ b.value = ''; }); boxes[0].focus();
  }
  async function tryUnlock(){
    if (busy) return; busy = true;
    msg.className = 'busy'; msg.textContent = 'Unlocking…';
    var pin = boxes.map(function(b){ return b.value; }).join('');
    try {
      var raw = b64ToBytes(PAYLOAD);
      var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
        base, { name:'AES-GCM', length: 256 }, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, ct);
      var html = new TextDecoder().decode(plain);
      localStorage.removeItem(FAIL_KEY); localStorage.removeItem(LOCK_KEY);
      document.open(); document.write(html); document.close();
    } catch (e) { fail(); }
  }
</script>
